<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NASA Space Museum — Deep Space</title>
</head>

<body>
  <div id="app">
    <div class="space-hud">
      <h1 class="hud-title">Space Museum</h1>
    </div>

    <div class="dock-prompt" id="dock-prompt">
      <span class="dock-badge-dot"></span>
      <span>Station Targeted &bull; Click to Land & Enter</span>
    </div>

    <!-- Center Interaction Prompt (Seats & Exhibits) -->
    <div id="interact-prompt" class="hidden">
      <div class="prompt-key">E</div>
      <div class="prompt-text">Sit in Seat</div>
    </div>

    <!-- Cinema Auditorium Seated HUD -->
    <div id="cinema-hud" class="hidden">
      <div class="cinema-hud-badge">🎬 MOVIE THEATRE AUDITORIUM</div>
      <div class="cinema-hud-title">NASA SPACE APPS • DOCUMENTARY THEATRE</div>
      <div class="cinema-hud-meta">
        <span id="cinema-seat-label">Row 2 • Seat 3</span>
        <span class="cinema-hud-dot">•</span>
        <span class="cinema-hud-state">POV View Mode</span>
      </div>
      <div class="cinema-hud-controls">
        <button id="btn-cinema-stand" class="btn-cinema-stand">STAND UP [E]</button>
        <span>•</span>
        <span>Press <kbd>E</kbd> or <kbd>Space</kbd> to Stand</span>
        <span>•</span>
        <span>Mouse to Look Around</span>
      </div>
    </div>

    <canvas id="webgl-canvas"></canvas>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
